name: Monitor de preços PS5

on:
  schedule:
    # Horários em UTC. 12:00 UTC = 09:00 em Brasília; 00:00 UTC = 21:00 em Brasília.
    # O GitHub pode atrasar alguns minutos em horários de pico.
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write         # para gravar o histórico de preços no repositório

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ler preços e avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # O Carrefour bloqueia os servidores do GitHub; ele é lido pelo Mac (pasta mac/).
        run: python -m monitor --sem-loja=carrefour

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "ps5-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --cached --quiet; then
            echo "Nada novo para gravar."
          else
            git commit -m "Leitura de preços $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase --quiet
            git push
          fi

      - name: Avisar se o próprio monitor quebrou
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=❌ Monitor PS5: a execução falhou. Veja o log: ${RUN_URL}"
          fi
