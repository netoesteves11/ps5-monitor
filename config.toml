# Monitor de preços PS5 — configuração
# Edite os valores-alvo à vontade; o próximo agendamento já usa os novos valores.

[settings]
# Quantas falhas seguidas (bloqueio, página mudou...) antes de te avisar.
falhas_para_avisar = 3
# Pausa aleatória entre páginas, em segundos (para não sobrecarregar as lojas).
pausa_min = 8
pausa_max = 20

# Vendedores aceitos. Só a conta oficial de cada uma das 4 lojas, em qualquer marketplace.
# Qualquer outro vendedor é ignorado.
[vendedores_aceitos]
kabum     = ["kabum!", "kabum"]
amazon    = ["amazon.com.br", "amazon"]
magalu    = ["magalu", "magalu.", "magazine luiza", "magazineluiza"]
carrefour = ["carrefour"]
# IDs de vendedor da Amazon (parâmetro "seller=" no perfil do vendedor)
amazon_seller_ids = ["A1ZZFT5FULY4LN", "AENDSMM69BUX2", "ACUNARZFR75ET"]  # Amazon, KaBuM!, Magalu

# Palavras que invalidam um anúncio para QUALQUER modelo (regex, sem diferenciar maiúsculas).
[filtros_globais]
excluir = [
  "leitor de disco", "com leitor", "m[ií]dia f[ií]sica", "blu-?ray", "standard",
  "usad[oa]", "seminov", "recondicionad", "reembalad", "vitrine", "outlet", "open ?box",
  "\\bpro\\b", "1 ?tb", "2 ?tb",
  "suporte", "capa", "tampa", "cooler", "base ", "carregador", "headset", "volante",
]

